# Host plane row: one small plugin, no preset copy.
#
# It listens for every newly created Agent and, for delegated execution
# children, records a default model route through the supported
# `agent.model.select()` API. Sessions keep using their shipped preset, so
# upstream preset/tool changes keep flowing in.
- insert:
    - id: subagent-executor-model
      name: '@local/dsh-subagent-executor-model'
      config:
        provider: opencode-go
        model: deepseek-v4.1-flash
        reasoningEffort: high
        # Optional: restrict to sessions composed from these preset ids.
        # Omit to apply to every preset.
        # presets:
        #   - standard
